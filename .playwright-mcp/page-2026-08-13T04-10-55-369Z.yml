                  - generic [ref=f4e150] [cursor=pointer]
                  - text: What I do
                - paragraph [ref=f4e154]: I'm an AI Full-Stack Developer with 14+ years of experience building production software. I design and ship AI-native products end to end — RAG pipelines, agentic workflows, and the full-stack applications that bring them to life.
                - paragraph [ref=f4e155]: "My AI work centers on Python, LangChain, ChromaDB, and local models via Ollama. My foundation is deep backend engineering: PHP (Laravel, Adobe Commerce), NestJS, and GraphQL Federation, with production experience on AWS EKS and event-driven architectures. That combination means my AI features are production-grade, not just demos."
                - heading "How I work" [level=2] [ref=f4e156]:
                  - generic [ref=f4e157] [cursor=pointer]
                  - text: How I work
                - paragraph [ref=f4e161]: I work as an independent contractor — which means I own the outcome, not just the task. I bring spec-driven planning, a test-first mindset, and clear communication to every engagement. Remote-first, async-friendly, Available to work US Eastern Time (ET) hours.
                - paragraph [ref=f4e162]: "I build agentic workflows and RAG systems — integrating LLMs with real data sources using LangChain, n8n, and local models via Ollama. Security is part of the design: I apply OWASP and AI safety practices, including prompt injection defense, from day one."
                - heading "Outside work" [level=2] [ref=f4e163]:
                  - generic [ref=f4e164] [cursor=pointer]
                  - text: Outside work
                - paragraph [ref=f4e168]: I'm Colombian — still figuring out the locals, but fully committed to the coffee. I'm into personal development, continuous learning, and building things that last — whether that's software or a good morning routine.
